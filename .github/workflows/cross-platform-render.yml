name: Cross-platform renderer

on:
  push:
    paths:
      - "punk-xhs-cards/scripts/render_cards.py"
      - "punk-xhs-cards/scripts/parse_markdown.py"
      - "punk-xhs-cards/scripts/character_registry.py"
      - "punk-xhs-cards/scripts/profile_registry.py"
      - "punk-xhs-cards/scripts/render_cards.sh"
      - "punk-xhs-cards/scripts/render_cards.ps1"
      - "punk-xhs-cards/requirements.txt"
      - "tests/smoke_render.py"
      - "tests/test_author_source.py"
      - ".github/workflows/cross-platform-render.yml"
  pull_request:
    paths:
      - "punk-xhs-cards/scripts/render_cards.py"
      - "punk-xhs-cards/scripts/parse_markdown.py"
      - "punk-xhs-cards/scripts/character_registry.py"
      - "punk-xhs-cards/scripts/profile_registry.py"
      - "punk-xhs-cards/scripts/render_cards.sh"
      - "punk-xhs-cards/scripts/render_cards.ps1"
      - "punk-xhs-cards/requirements.txt"
      - "tests/smoke_render.py"
      - "tests/test_author_source.py"
      - ".github/workflows/cross-platform-render.yml"

jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linux Chinese font
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Select Windows font
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $font = "C:\Windows\Fonts\msyh.ttc"
          if (-not (Test-Path $font)) { $font = "C:\Windows\Fonts\arial.ttf" }
          "XHS_IP_CARDS_FONT=$font" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install renderer dependency
        run: python -m pip install -r punk-xhs-cards/requirements.txt
      - name: Run smoke test
        run: |
          python tests/test_author_source.py
          python tests/smoke_render.py
