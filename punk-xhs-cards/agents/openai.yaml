interface:
  display_name: "Punk XHS Cards"
  short_description: "从个人 IP 和 Markdown 生成小红书书封知识卡片"
  default_prompt: "使用 $punk-xhs-cards 开始首次引导：先显示 Punk 的欢迎语，再请我准备 4 项：一张清晰的人物照片或已完成的个人 IP 图；一个人物名称或昵称，它会作为封面作者名；一个主题色，最好给出 Hex 色值或颜色参考，没有时从 IP 服装或配件提取候选色请我确认；以及希望人物执行的卡片动作。人物与样式确认后，调用 $punk-ip-article-illustrations 根据 Markdown 生成主题插图，再制作主题色背景、无框圆润短标题、精细 16:9 macOS 窗口和粗体衬线作者名的封面，以及小红书内页、发布正文和 tags。"
